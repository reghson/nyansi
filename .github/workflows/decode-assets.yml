name: Decode image assets and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 assets and publish to gh-pages
        run: |
          set -e
          if [ -f assets.b64.txt ]; then
            while read -r path data; do
              [ -z "$path" ] && continue
              mkdir -p "$(dirname "$path")"
              printf '%s' "$data" | base64 -d > "$path"
            done < assets.b64.txt
            git rm -q assets.b64.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Decode image assets"
          git push origin HEAD:main
          git push origin --delete gh-pages || true
